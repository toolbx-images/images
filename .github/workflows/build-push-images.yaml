name: Build and push toolbx images

on:
  workflow_call:
    inputs:
      distro:
        description: Distribution to build for
        required: true
        type: string

      releases:
        description: Distribution releases to build, separated by space
        required: true
        type: string

      latest-release:
        description: Distribution release to be tagged 'latest'
        required: true
        type: string

      registry:
        description: Registry to push to
        required: true
        type: string

      platforms:
        description: Build images for the given platforms, separated by comma
        required: false
        type: string

    secrets:
      registry-user:
        description: Username used to log into registry
        required: true

      registry-password:
        description: Password used to log into registry
        required: true

      cosign-private-key:
        description: Private key to sign containers with
        required: true

jobs:
  context:
    runs-on: ubuntu-26.04
    outputs:
      releases: ${{ steps.context.outputs.releases }}
      timestamp: ${{ steps.context.outputs.timestamp }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: context
        env:
          RELEASES: ${{ inputs.releases }}
        with:
          script: |
            const releases = process.env.RELEASES.split(/\s+/);
            const timestamp = Math.floor(Date.now() / 1000);
            core.setOutput('releases', JSON.stringify(releases));
            core.setOutput('timestamp', timestamp);

  build-and-push:
    needs: [context]
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.context.outputs.releases) }}
        include:
          - release: ${{ inputs.latest-release }}
            extra-tag: latest latest-${{ needs.context.outputs.timestamp }}

    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU for multi-arch builds
        shell: bash
        run: |
          sudo apt update
          sudo apt install qemu-user-binfmt

      - name: Build container image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          platforms: ${{ inputs.platforms }}
          context: ${{ inputs.distro }}/${{ matrix.release }}
          image: ${{ inputs.distro }}-toolbox
          tags: |
            ${{ matrix.release }}
            ${{ matrix.release }}-${{ needs.context.outputs.timestamp }}
            ${{ matrix.extra-tag }}
          containerfiles: ${{ inputs.distro }}/${{ matrix.release }}/Containerfile
          layers: false
          oci: true

      - name: Login to Container Registry
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-user }}
          password: ${{ secrets.registry-password }}

      - name: Push to Container Registry
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        id: push
        if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        with:
          image: ${{ inputs.distro }}-toolbox
          registry: ${{ inputs.registry }}
          extra-args: --add-compression zstd:chunked
          tags: |
            ${{ matrix.release }}
            ${{ matrix.release }}-${{ needs.context.outputs.timestamp }}
            ${{ matrix.extra-tag }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'

      - name: Sign container image
        if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        run: |
          cosign sign -y --recursive --registry-referrers-mode=legacy --key env://COSIGN_PRIVATE_KEY ${INPUTS_REGISTRY}/${INPUTS_DISTRO}-toolbox@${STEPS_PUSH_OUTPUTS_DIGEST}
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.cosign-private-key }}
          INPUTS_REGISTRY: ${{ inputs.registry }}
          INPUTS_DISTRO: ${{ inputs.distro }}
          STEPS_PUSH_OUTPUTS_DIGEST: ${{ steps.push.outputs.digest }}
